<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murmur Settings</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Murmur</h1>
      <p class="subtitle">Local, private dictation.</p>
      <section id="models" class="card">
        <h2>Speech model</h2>
        <p class="hint">
          Transcription runs entirely on this device. The model is downloaded

        </p>
        <div id="model-list"></div>
      </section>
      <section id="settings">
        <p class="placeholder">More settings coming soon.</p>
      </section>
    </main>
  </body>
</html>
