name: Windows crash repro

# Diagnostic harness: install the shipped v0.1.2 Windows build on a runner,
# launch it, click the settings window like a user would, and capture the
# crash evidence (Windows Application Event Log + WER minidump + app log).
# Temporary — delete once the Windows crash is fixed.

on:
  push:
    branches: [debug/windows-crash-repro]
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    steps:
      - name: Enable WER local crash dumps
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\murmur.exe" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\murmur.exe" -Name DumpFolder -Value "C:\dumps" -Type ExpandString
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\murmur.exe" -Name DumpType -Value 2 -Type DWord
          New-Item -ItemType Directory -Path C:\dumps -Force | Out-Null

      - name: Report WebView2 runtime version
        shell: pwsh
        run: |
          $paths = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) { Get-ItemProperty $p | Select-Object pv, name | Format-List }
          }

      - uses: actions/checkout@v4
        with:
          ref: fix/windows-off-main-thread-ub

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the fixed app
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml
          $exe = "$PWD\src-tauri\target\release\murmur.exe"
          Write-Host "Built exe: $exe"
          Set-Content -Path exe-path.txt -Value $exe

      - name: Launch, click, and observe
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public class Win32 {
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            public static List<IntPtr> All() {
              var list = new List<IntPtr>();
              EnumWindows((h, l) => { list.Add(h); return true; }, IntPtr.Zero);
              return list;
            }
            public struct RECT { public int Left, Top, Right, Bottom; }
          }
          "@
          $exePath = (Get-Content exe-path.txt).Trim()
          $p = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Host "RESULT: app exited BEFORE any click, exit code $($p.ExitCode) (0x$('{0:X8}' -f $p.ExitCode))"
          } else {
            Write-Host "App is running before click (pid $($p.Id))."
            Get-Process | Where-Object { $_.Name -match 'murmur|msedgewebview2' } | Select-Object Id, Name, MainWindowTitle | Format-Table | Out-String | Write-Host
            $h = [IntPtr]::Zero
            foreach ($w in [Win32]::All()) {
              $wpid = 0
              [Win32]::GetWindowThreadProcessId($w, [ref]$wpid) | Out-Null
              if ($wpid -eq $p.Id) {
                $t = New-Object System.Text.StringBuilder 256; [Win32]::GetWindowTextW($w, $t, 256) | Out-Null
                $c = New-Object System.Text.StringBuilder 256; [Win32]::GetClassNameW($w, $c, 256) | Out-Null
                $vis = [Win32]::IsWindowVisible($w)
                $r2 = New-Object Win32+RECT
                [Win32]::GetWindowRect($w, [ref]$r2) | Out-Null
                Write-Host "hwnd=$w class='$($c)' title='$($t)' visible=$vis rect=($($r2.Left),$($r2.Top))-($($r2.Right),$($r2.Bottom))"
                if ($vis -and ($r2.Right - $r2.Left) -gt 300) { $h = $w }
              }
            }
            Write-Host "Chosen window to click: $h"
            if ($h -ne [IntPtr]::Zero) {
              function Click([int]$cx, [int]$cy) {
                [Win32]::SetCursorPos($cx, $cy) | Out-Null
                Start-Sleep -Milliseconds 120
                [Win32]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
                [Win32]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              }
              $r = New-Object Win32+RECT
              [Win32]::GetWindowRect($h, [ref]$r) | Out-Null
              $x = [int](($r.Left + $r.Right) / 2)
              Write-Host "Window rect ($($r.Left),$($r.Top))-($($r.Right),$($r.Bottom))"
              # Open notepad as the focus-toggle partner window.
              $np = Start-Process notepad -PassThru
              Start-Sleep -Seconds 2
              # Stress loop: toggle focus and click around the window (incl. the
              # model list area to trigger the async download command + progress
              # event storm), like an impatient user, for up to ~4 minutes.
              $deadline = (Get-Date).AddMinutes(4)
              $i = 0
              while ((Get-Date) -lt $deadline) {
                $i++
                [Win32]::SetForegroundWindow($h) | Out-Null
                Start-Sleep -Milliseconds 200
                # sweep clicks down the page: hits hotkey button, mode radios,
                # model rows, checkboxes at various scroll positions
                $ys = @(200, 300, 400, 450, 500, 560, 620)
                Click $x ($r.Top + $ys[$i % $ys.Count])
                Start-Sleep -Milliseconds 400
                $p.Refresh()
                if ($p.HasExited) { break }
                if ($np -and -not $np.HasExited) { [Win32]::SetForegroundWindow($np.MainWindowHandle) | Out-Null }
                Start-Sleep -Milliseconds 400
                $p.Refresh()
                if ($p.HasExited) { break }
                if ($i % 20 -eq 0) { Write-Host "iteration $i, app still alive" }
              }
              Write-Host "Stress loop ended after $i iterations."
            } else {
              Write-Host "Window not found; is the app headless here?"
              Start-Sleep -Seconds 10
            }
            $p.Refresh()
            if ($p.HasExited) {
              Write-Host "RESULT: app exited DURING stress, exit code $($p.ExitCode) (0x$('{0:X8}' -f $p.ExitCode))"
            } else {
              Write-Host "RESULT: app still running after stress. No crash reproduced."
              Stop-Process -Id $p.Id -Force
            }
          }
          Start-Sleep -Seconds 5
          exit 0

      - name: Verify the event-driven download flow worked
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "com.murmur.app\logs\murmur.log"
          if (-not (Test-Path $log)) { Write-Error "no app log found"; exit 1 }
          $content = Get-Content $log -Raw
          if ($content -notmatch 'downloaded and verified') {
            Write-Error "stress run never completed a model download - event-driven flow broken?"
            exit 1
          }
          if ($content -notmatch 'active model switched') {
            Write-Error "model never activated after download - completion event not handled?"
            exit 1
          }
          Write-Host "download flow OK: download completed and model switched via events"

      - name: Collect crash evidence
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Application Event Log: Application Error (1000) / WER (1001) ==="
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=@(1000,1001)} -MaxEvents 20 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'murmur' } |
            ForEach-Object { Write-Host "----"; Write-Host $_.Message }
          Write-Host "=== Dumps ==="
          Get-ChildItem C:\dumps -ErrorAction SilentlyContinue
          Write-Host "=== App log ==="
          $log = Join-Path $env:LOCALAPPDATA "com.murmur.app\logs\murmur.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "no app log at $log"; Get-ChildItem $env:LOCALAPPDATA -Directory | Select-Object -ExpandProperty Name }
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          Copy-Item C:\dumps\*.dmp evidence\ -ErrorAction SilentlyContinue
          if (Test-Path $log) { Copy-Item $log evidence\ }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-evidence
          path: evidence/
          if-no-files-found: ignore
