name: Release

# Releases are cut automatically: any push to main whose version (in
# src-tauri/tauri.conf.json) has no GitHub Release yet builds the installers
# and publishes v<version>. Merging a version-bump PR is all it takes.
# Pushing a v* tag by hand still works and goes through the same gate.
on:
  push:
    branches: [main]
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this push produces a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will build and publish v$VERSION."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
            tauri-args: --target universal-apple-darwin
          - os: ubuntu-latest
            bundles: appimage,deb
            tauri-args: ""
          - os: windows-latest
            bundles: msi,nsis
            tauri-args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libasound2-dev \
            libxdo-dev

      # sherpa-onnx links statically; its build script requires this
      # relocation model on Linux.
      - name: Set Linux RUSTFLAGS for static sherpa-onnx
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C relocation-model=dynamic-no-pic" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend tooling
        run: npm ci || npm install

      - name: Build bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.tauri-args }}

      # Regression guard: macOS TCC only persists permission grants for apps
      # with a real code signature, and a hardened-runtime app without the
      # audio-input entitlement is hard-denied microphone access (no prompt,
      # no System Settings entry). Neither may ever ship.
      #
      # The checks run against the app INSIDE the dmg — the artifact users
      # actually install. (Tauri deletes the intermediate .app directory
      # after packing the dmg, and verifying the shipped bytes is stronger
      # anyway.)
      - name: Verify macOS code signature and entitlements
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          MOUNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          APP="$MOUNT/Murmur.app"
          codesign --verify --deep --strict "$APP"
          codesign -d --verbose=2 "$APP" 2>&1 | tee /tmp/murmur-signature.txt
          grep -q "^Identifier=com.murmur.app$" /tmp/murmur-signature.txt
          if grep -q "linker-signed" /tmp/murmur-signature.txt; then
            echo "::error::bundle is only linker-signed; TCC grants will not persist"
            exit 1
          fi
          codesign -d --entitlements - "$APP" 2>&1 | tee /tmp/murmur-entitlements.txt
          if ! grep -q "com.apple.security.device.audio-input" /tmp/murmur-entitlements.txt; then
            echo "::error::audio-input entitlement missing; microphone would be hard-denied"
            exit 1
          fi
          echo "signature and entitlements verified inside $DMG"

      - name: Collect and rename artifacts
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)
              cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
                 "dist/murmur-${VERSION}-macos-universal.dmg"
              ;;
            Linux)
              cp src-tauri/target/release/bundle/appimage/*.AppImage \
                 "dist/murmur-${VERSION}-linux-x86_64.AppImage"
              cp src-tauri/target/release/bundle/deb/*.deb \
                 "dist/murmur-${VERSION}-linux-x86_64.deb"
              ;;
            Windows)
              cp src-tauri/target/release/bundle/msi/*.msi \
                 "dist/murmur-${VERSION}-windows-x86_64.msi"
              cp src-tauri/target/release/bundle/nsis/*-setup.exe \
                 "dist/murmur-${VERSION}-windows-x86_64.exe"
              ;;
          esac
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract changelog section
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "---- notes ----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
