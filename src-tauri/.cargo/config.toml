# Windows/MSVC:
# - +crt-static: sherpa-onnx/onnxruntime prebuilt static archives are built
#   with the static CRT (/MT); Rust must match or the C++ runtime is defined
#   twice (LNK2005). Statically linking the CRT also removes the VC++
#   redistributable requirement for users.
# - advapi32 must come after every archive on the link line (onnxruntime
#   uses ETW + registry APIs), which a build-script rustc-link-lib cannot
#   guarantee — a trailing link-arg can.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-arg=advapi32.lib",
]
