[package]
name = "murmur"
version = "0.1.0"
description = "Local, private dictation for your desktop"
authors = ["Utkarsh Bhardwaj"]
license = "MIT"
repository = "https://github.com/bhardwajutkarsh/murmur"
edition = "2021"

[lib]
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
