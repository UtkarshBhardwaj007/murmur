[package]
name = "murmur"
version = "0.1.2"
description = "Local, private dictation for your desktop"
authors = ["Utkarsh Bhardwaj"]
license = "MIT"
repository = "https://github.com/UtkarshBhardwaj007/murmur"
edition = "2021"

[lib]
name = "murmur_lib"
# Desktop-only app: staticlib/cdylib are only needed for Tauri mobile and
# double Windows link time (and the cdylib trips over static-CRT C++ deps).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.1"
hound = "3.5.1"
anyhow = "1.0.104"
log = "0.4.33"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2.9.0"
whisper-rs = "0.16.0"
sha2 = "0.11.0"
hex = "0.4.3"
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }
tokio = { version = "1.53.1", features = ["fs", "io-util"] }
directories = "6.0.0"
arboard = "3.6.1"
enigo = "0.6.1"
tauri-plugin-autostart = "2.5.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
macos-accessibility-client = "0.0.2"
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSThread"] }

# sherpa-onnx, statically linked everywhere. The prebuilt "static" archive
# for Linux ships no .a files, so Linux builds sherpa-onnx from the source
# vendored in sherpa-rs-sys (cmake) instead of downloading binaries.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }

[target.'cfg(target_os = "linux")'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["static"] }
